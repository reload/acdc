on: push
name: Run tests

jobs:
  unit_tests:
    name: "Unit tests"
    runs-on: ubuntu-latest
    if: '!github.event.deleted'
    steps:
    - name: 'Checkout code'
      uses: actions/checkout@v7
    - name: Setup PHP, with composer and extensions
      uses: shivammathur/setup-php@master
      with:
        php-version: 8.5
        coverage: pcov
    - name: Install Dependencies
      run: |
        composer install --no-interaction --no-progress
    - name: 'Run unit tests'
      run: |
        vendor/bin/phpunit --testsuite Unit --coverage-clover=unit.xml
    - name: 'Upload CodeCov report'
      uses: codecov/codecov-action@v7
      with:
        files: ./unit.xml
        flags: unit
        fail_ci_if_error: true
        # Needed for Dependabot PRs.
        token: ${{ secrets.CODECOV_TOKEN }}

  feature_tests:
    name: "Feature tests"
    runs-on: ubuntu-latest
    if: '!github.event.deleted'
    steps:
    - name: 'Checkout code'
      uses: actions/checkout@v7
    - name: Setup PHP, with composer and extensions
      uses: shivammathur/setup-php@master
      with:
        php-version: 8.5
        coverage: pcov
    - name: Install Dependencies
      run: |
        composer install --no-interaction --no-progress
    - name: 'Run feature tests'
      env:
        APP_KEY: "base64:Z++HhObkg1plehwZlK6RGSRVi4uWPiUGRYFoDOt2/Ig="
        LOG_CHANNEL: "errorlog"
      run: |
        vendor/bin/phpunit --testsuite Feature --coverage-clover=feature.xml
    - name: 'Upload CodeCov report'
      uses: codecov/codecov-action@v7
      with:
        files: ./feature.xml
        flags: feature
        fail_ci_if_error: true
        # Needed for Dependabot PRs.
        token: ${{ secrets.CODECOV_TOKEN }}
